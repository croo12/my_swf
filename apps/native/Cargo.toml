[package]
name = "factory-workbench"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
factory-core = { path = "../../crates/factory-core" }
factory-layout = { path = "../../crates/factory-layout" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "system_fonts", "accesskit", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", default-features = false, features = ["eframe"] }
egui_system_font_provider = "=0.37.0"
tempfile = "3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }
