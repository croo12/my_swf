[package]
name = "factory-workbench"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
factory-plan = { path = "../../crates/factory-plan" }
factory-repository = { path = "../../crates/factory-repository" }
factory-session = { path = "../../crates/factory-session" }
factory-remote-repository = { path = "../../crates/factory-remote-repository" }
factory-layout-comparison = { path = "../../crates/factory-layout-comparison" }
factory-layout = { path = "../../crates/factory-layout" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "system_fonts", "accesskit", "x11", "wayland"] }
rfd = "0.17"

[dev-dependencies]
egui_kittest = { version = "=0.37.0", default-features = false, features = ["eframe"] }
egui_system_font_provider = "=0.37.0"
tempfile = "3"
