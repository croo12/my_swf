[package]
name = "factory-server"
version = "0.1.8"
edition = "2021"

[dependencies]
factory-core = { path = "../factory-core" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
