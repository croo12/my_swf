name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      # Type check, oxlint, Feature-Sliced Design rules (steiger), and oxfmt formatting.
      - run: npm run check
      - run: npm run build

  server:
    name: server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p factory-server --locked
