name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-source-limits:
    name: native Rust source limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Run the same Cargo build guard without fetching dependencies or preparing the router.
      - run: |
          rustc --edition=2024 apps/native/build.rs -o "$RUNNER_TEMP/check-native-sources"
          CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/apps/native" "$RUNNER_TEMP/check-native-sources"

  server:
    name: server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Includes the tests of the proposal validator.
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p factory-repository -p factory-plan -p factory-session -p factory-remote-repository -p factory-server --all-targets --locked -- -D warnings
      - run: cargo test -p factory-repository -p factory-plan -p factory-session -p factory-remote-repository -p factory-server --locked

  native:
    name: native (${{ matrix.os }})
    needs: native-source-limits
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare Windows router
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/native/prepare-router.ps1
      - name: Prepare macOS router
        if: runner.os == 'macOS'
        run: |
          brew install automake libtool pkg-config
          bash scripts/native/prepare-router.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run feature and headless UI regressions
        run: cargo test --workspace --locked
      - run: cargo build -p factory-workbench --release --locked
      - name: Check standalone Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path (Get-Location).Path 'target/standalone-check'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath target/release/factory-workbench.exe -Destination $directory
          $check = Start-Process -FilePath "$directory/factory-workbench.exe" -ArgumentList '--check-router' -WorkingDirectory $directory -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Embedded router check failed: $($check.ExitCode)" }
          if ((Get-ChildItem -LiteralPath $directory).Count -ne 1) { throw 'The executable created sidecar files' }
      - name: Check standalone macOS executable
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/standalone-check
          cp target/release/factory-workbench target/standalone-check/
          (cd target/standalone-check && ./factory-workbench --check-router)
          test "$(find target/standalone-check -type f | wc -l | tr -d ' ')" = 1
