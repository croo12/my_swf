name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      # Type check, oxlint, Feature-Sliced Design rules (steiger), and oxfmt formatting.
      - run: npm run check
      - run: npm run build

  server:
    name: server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Includes the tests of the proposal validator.
      - run: cargo test -p factory-core -p factory-server --locked

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p factory-workbench -- --check
      - run: cargo clippy -p factory-workbench --locked -- -D warnings
      - run: cargo test -p factory-core -p factory-workbench --locked
      - run: cargo build -p factory-workbench --release --locked
